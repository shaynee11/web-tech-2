<header class="page-header">
  <h1>List of Students</h1>
  <button class="add-btn" (click)="goToCreateStudent()">Add Student</button>
</header>

<main class="students-container">
  <section class="students-list" role="list">
    @for (student of students(); track student.id) {
      <article class="student-card" role="listitem">
        <div class="student-info">
          <h2 class="student-name">{{ student.first_name }} {{ student.last_name }}</h2>
          <p class="student-course">{{ student.course }}</p>
          <p class="student-year">Year {{ student.year_level }}</p>
        </div>
        <div class="actions">
          <button class="delete-btn" (click)="deleteStudent(student.id)">Delete</button>
        </div>
      </article>
    }
    @empty {
      <span>No students found</span>
    }
  </section>
</main>
