<header class="page-header">
  <h1>List of Students</h1>
  <button class="add-btn" (click)="goToCreateStudent()">Add Student</button>
</header>

<main class="students-container">
  <section class="students-list" role="list">
    <article class="student-card" *ngFor="let student of students; let i = index" role="listitem">
      <div class="student-info">
        <h2 class="student-name">{{ student.name }}</h2>
        <p class="student-course">{{ student.course }}</p>
        <p class="student-year">{{ student.year }}</p>
      </div>
      <div class="actions">
        <button class="delete-btn" (click)="deleteStudent(i)">Delete</button>
      </div>
    </article>
  </section>
</main>
