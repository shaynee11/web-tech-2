<main class="container">
  <form class="student-form" [formGroup]="form">

    <div class="form-group">
      <label for="firstName">First Name</label>
      <input 
        id="firstName" 
        type="text" 
        formControlName="first_name"
        placeholder="Enter first name">
      <span class="error" *ngIf="form.get('first_name')?.invalid && form.get('first_name')?.touched">
        First name is required
      </span>
    </div>

    <div class="form-group">
      <label for="lastName">Last Name</label>
      <input 
        id="lastName" 
        type="text" 
        formControlName="last_name"
        placeholder="Enter last name">
      <span class="error" *ngIf="form.get('last_name')?.invalid && form.get('last_name')?.touched">
        Last name is required
      </span>
    </div>

    <div class="form-group">
      <label for="email">Email</label>
      <input 
        id="email" 
        type="email" 
        formControlName="email"
        placeholder="Enter email address">
      <span class="error" *ngIf="form.get('email')?.invalid && form.get('email')?.touched">
        <span *ngIf="form.get('email')?.hasError('required')">Email is required</span>
        <span *ngIf="form.get('email')?.hasError('email')">Email must be valid</span>
      </span>
    </div>

    <div class="form-group">
      <label for="age">Age</label>
      <input 
        id="age" 
        type="number" 
        formControlName="age"
        placeholder="Enter age">
      <span class="error" *ngIf="form.get('age')?.invalid && form.get('age')?.touched">
        Age is required
      </span>
    </div>

    <div class="form-group">
      <label for="course">Course</label>
      <input 
        id="course" 
        type="text" 
        formControlName="course"
        placeholder="Enter course">
      <span class="error" *ngIf="form.get('course')?.invalid && form.get('course')?.touched">
        Course is required
      </span>
    </div>

    <div class="form-group">
      <label for="yearLevel">Year Level</label>
      <input 
        id="yearLevel" 
        type="number" 
        formControlName="year_level"
        placeholder="Enter year level">
      <span class="error" *ngIf="form.get('year_level')?.invalid && form.get('year_level')?.touched">
        Year level is required
      </span>
    </div>

    <div class="form-group">
      <label for="gpa">GPA</label>
      <input 
        id="gpa" 
        type="number" 
        step="0.01" 
        formControlName="gpa"
        placeholder="Enter GPA">
      <span class="error" *ngIf="form.get('gpa')?.invalid && form.get('gpa')?.touched">
        GPA is required
      </span>
    </div>

    <div class="form-actions">
      <button type="button" class="cancel" (click)="goBack()">Cancel</button>
      <button type="button" class="save" (click)="createStudent()" [disabled]="form.invalid">Save</button>
    </div>

  </form>
</main>
